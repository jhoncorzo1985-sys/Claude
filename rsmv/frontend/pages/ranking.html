<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking — RSMV</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <div class="navbar-logo">RSMV</div>
    </a>
    <div class="navbar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="torneos.html">Torneos</a>
      <a href="ranking.html" class="active">Ranking</a>
      <div id="navAuth"></div>
    </div>
  </div>
</nav>

<main style="padding:40px 20px;max-width:1000px;margin:0 auto;">
  <div class="flex-between mb-24">
    <div>
      <h1 class="page-title">Ranking Global</h1>
      <p class="page-subtitle">Los mejores jugadores de RSMV</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline btn-sm active" onclick="filtrar(null, this)">Todos</button>
      <button class="btn btn-outline btn-sm" onclick="filtrar('estrella_rsmv', this)">⭐ Estrellas</button>
      <button class="btn btn-outline btn-sm" onclick="filtrar('nacional', this)">🔴 Nacional</button>
      <button class="btn btn-outline btn-sm" onclick="filtrar('regional', this)">🔵 Regional</button>
    </div>
  </div>

  <div id="rankingLoading" style="text-align:center;padding:60px;">
    <div class="spinner" style="width:40px;height:40px;border-width:3px;margin:0 auto 16px;"></div>
    <div class="text-muted">Cargando ranking...</div>
  </div>

  <div id="rankingContent" style="display:none;">
    <!-- Top 3 podio -->
    <div id="podio" class="grid-3 mb-24"></div>

    <!-- Tabla completa -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Jugador</th>
            <th>Nivel</th>
            <th>EXP</th>
            <th>Goles</th>
            <th>Victorias</th>
            <th>Equipo</th>
          </tr>
        </thead>
        <tbody id="rankingTable"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
  // Auth nav
  if (api.isLoggedIn()) {
    document.getElementById('navAuth').innerHTML = `
      <div class="mc-badge" onclick="window.location.href='tienda.html'">
        ◈ <span class="mc-saldo-valor">...</span> MC
      </div>
      <button class="btn btn-outline btn-sm" onclick="api.logout()">Salir</button>`;
    actualizarSaldoNavbar();
  } else {
    document.getElementById('navAuth').innerHTML = `
      <a href="login.html" class="btn btn-outline btn-sm">Iniciar sesión</a>
      <a href="register.html" class="btn btn-primary btn-sm">Registrarse</a>`;
  }

  let currentFilter = null;

  const medallas = ['🥇', '🥈', '🥉'];
  const podioColors = [
    'border-color:rgba(255,215,0,0.5);background:rgba(255,215,0,0.05)',
    'border-color:rgba(192,192,192,0.4);background:rgba(192,192,192,0.03)',
    'border-color:rgba(205,127,50,0.4);background:rgba(205,127,50,0.03)'
  ];

  async function filtrar(nivel, btn) {
    document.querySelectorAll('button[onclick^="filtrar"]').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    currentFilter = nivel;
    await cargarRanking();
  }

  async function cargarRanking() {
    document.getElementById('rankingLoading').style.display = 'block';
    document.getElementById('rankingContent').style.display = 'none';

    try {
      const params = { limit: 50 };
      if (currentFilter) params.nivel = currentFilter;
      const jugadores = await api.getRanking(params);

      // Podio top 3
      const podio = document.getElementById('podio');
      podio.innerHTML = jugadores.slice(0,3).map((j, i) => `
        <div class="card" style="${podioColors[i]}">
          <div style="text-align:center;">
            <div style="font-size:40px;margin-bottom:8px;">${medallas[i]}</div>
            <div style="font-weight:700;font-size:16px;">${j.perfiles?.nombre_completo || 'Jugador'}</div>
            <div style="color:var(--text-muted);font-size:13px;margin:4px 0;">${j.perfiles?.ciudad || ''}</div>
            <div style="margin:8px 0;">${nivelBadge(j.nivel)}</div>
            <div style="font-size:28px;font-weight:700;color:var(--cyan);">${j.exp_total.toLocaleString()}</div>
            <div style="font-size:11px;color:var(--text-muted);">EXP</div>
            ${j.equipos ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">🤖 ${j.equipos.nombre}</div>` : ''}
          </div>
        </div>`).join('');

      // Tabla completa
      const tbody = document.getElementById('rankingTable');
      tbody.innerHTML = jugadores.map((j, i) => `
        <tr>
          <td style="font-weight:700;color:${i < 3 ? 'var(--gold)' : 'var(--text-muted)'};">#${i+1}</td>
          <td>
            <div style="font-weight:600;">${j.perfiles?.nombre_completo || 'Jugador'}</div>
            <div style="font-size:12px;color:var(--text-muted);">${j.perfiles?.ciudad || ''}</div>
          </td>
          <td>${nivelBadge(j.nivel)}</td>
          <td style="font-weight:700;color:var(--cyan);">${j.exp_total.toLocaleString()}</td>
          <td style="color:var(--gold);">${(j.goles_partido + j.goles_penales).toLocaleString()}</td>
          <td style="color:var(--green);">${j.partidos_ganados || 0}</td>
          <td style="color:var(--text-muted);font-size:13px;">${j.equipos?.nombre || '—'}</td>
        </tr>`).join('');

      document.getElementById('rankingLoading').style.display = 'none';
      document.getElementById('rankingContent').style.display = 'block';

    } catch (err) {
      document.getElementById('rankingLoading').innerHTML =
        `<div class="text-red">Error: ${err.message}</div>`;
    }
  }

  cargarRanking();
</script>
</body>
</html>
