<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — RSMV</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background:
        radial-gradient(ellipse 60% 40% at 30% 20%, rgba(0,212,255,0.08), transparent),
        radial-gradient(ellipse 60% 40% at 70% 80%, rgba(0,255,136,0.06), transparent),
        var(--bg-black);
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo h1 {
      font-size: 32px;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: 4px;
    }

    .auth-logo p {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    #error-msg {
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      color: var(--red);
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" style="text-decoration:none;">
        <h1>RSMV</h1>
        <p>ROBOT SOCCER MARE VIRTUAL</p>
      </a>
    </div>

    <h2 class="auth-title">Iniciar Sesión</h2>

    <div id="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input"
               placeholder="tu@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-input"
               placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        Iniciar Sesión
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta?
      <a href="register.html">Regístrate gratis</a>
      <br><br>
      <a href="/" style="color:var(--text-muted);font-size:12px;">← Volver al inicio</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // Redirigir si ya está logueado
    if (api.isLoggedIn()) window.location.href = 'dashboard.html';

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Entrando...';

      try {
        await api.login(email, password);
        showToast('¡Bienvenido de vuelta!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 500);
      } catch (err) {
        errorMsg.textContent = err.message || 'Error al iniciar sesión';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
