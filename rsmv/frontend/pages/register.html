<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — RSMV</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background:
        radial-gradient(ellipse 60% 40% at 70% 20%, rgba(0,255,136,0.08), transparent),
        radial-gradient(ellipse 60% 40% at 30% 80%, rgba(0,212,255,0.06), transparent),
        var(--bg-black);
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }

    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo h1 { font-size: 28px; font-weight: 900; color: var(--cyan); letter-spacing: 4px; }
    .auth-logo p { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .welcome-box {
      background: rgba(0,255,136,0.06);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--green);
      text-align: center;
    }

    #error-msg {
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      color: var(--red);
      margin-bottom: 20px;
      display: none;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" style="text-decoration:none;">
        <h1>RSMV</h1>
        <p>ROBOT SOCCER MARE VIRTUAL</p>
      </a>
    </div>

    <div class="welcome-box">
      🎁 Recibirás <strong>50 Marecoin</strong> de bienvenida al registrarte
    </div>

    <div id="error-msg"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label">Nombre Completo *</label>
        <input type="text" id="nombre" class="form-input"
               placeholder="Tu nombre completo" required minlength="2">
      </div>

      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" id="email" class="form-input"
               placeholder="tu@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña *</label>
        <input type="password" id="password" class="form-input"
               placeholder="Mínimo 8 caracteres" required minlength="8"
               autocomplete="new-password">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Ciudad</label>
          <input type="text" id="ciudad" class="form-input" placeholder="Medellín">
        </div>
        <div class="form-group">
          <label class="form-label">WhatsApp</label>
          <input type="text" id="whatsapp" class="form-input" placeholder="3001234567">
        </div>
      </div>

      <div style="font-size:12px;color:var(--text-muted);margin-bottom:20px;">
        Al registrarte aceptas los términos y condiciones de RSMV y Marelab.
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        ⚽ Crear mi cuenta
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-muted);">
      ¿Ya tienes cuenta?
      <a href="login.html">Iniciar sesión</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    if (api.isLoggedIn()) window.location.href = 'dashboard.html';

    const form = document.getElementById('registerForm');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const datos = {
        nombre_completo: document.getElementById('nombre').value.trim(),
        email: document.getElementById('email').value.trim().toLowerCase(),
        password: document.getElementById('password').value,
        ciudad: document.getElementById('ciudad').value.trim() || undefined,
        whatsapp: document.getElementById('whatsapp').value.trim() || undefined
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creando cuenta...';

      try {
        await api.register(datos);
        // Auto-login
        await api.login(datos.email, datos.password);
        showToast('¡Cuenta creada! Bienvenido a RSMV 🤖', 'success', 3000);
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (err) {
        errorMsg.textContent = err.message || 'Error al crear la cuenta';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '⚽ Crear mi cuenta';
      }
    });
  </script>
</body>
</html>
